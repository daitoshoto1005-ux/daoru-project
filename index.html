<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAORU | DAO Discovery</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --primary: #2ecc71;
  --primary-light: #ebfaf0;
  --line-color: #06C755;
  --bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  --card: #ffffff;
  --text: #1e293b;
  --text-light: #64748b;
  --hot-color: #e74c3c;
  --discord-color: #5865F2;
}

body {
  margin: 0;
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: 100px;
  min-height: 100vh;
}

header { padding: 40px 20px; text-align: center; }
h1 { margin: 0; font-size: 32px; color: var(--primary); letter-spacing: 2px; font-weight: 900; }
.sub { font-size: 13px; color: var(--text-light); margin-top: 5px; }

.search-container { padding: 0 20px 20px; max-width: 500px; margin: 0 auto; }
.search-box { position: relative; display: flex; align-items: center; }
.search-box i { position: absolute; left: 15px; color: var(--text-light); }
.search-box input {
  width: 100%; padding: 15px 15px 15px 45px; border-radius: 30px; border: 1px solid #e2e8f0;
  background: var(--card); font-size: 16px; outline: none; transition: all 0.3s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

.container { padding: 0 15px; max-width: 600px; margin: 0 auto; }
.item-card {
  background: var(--card); border-radius: 24px; padding: 24px; margin-bottom: 16px;
  border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  cursor: pointer; transition: all 0.2s ease; position: relative;
}
.item-card:active { transform: scale(0.98); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: bold; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 20px; }
.hot-badge { font-size: 10px; color: var(--hot-color); font-weight: bold; background: #fff5f5; padding: 2px 8px; border-radius: 10px; border: 1px solid #ffc1c1; }

.item-info h3 { margin: 0; font-size: 20px; font-weight: 800; }
.item-info p { margin: 8px 0 0; font-size: 14px; color: var(--text-light); }

.fixed-footer {
  position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(15px); border-top: 1px solid #e2e8f0; padding: 15px 20px; z-index: 900;
}
.line-btn {
  background: var(--line-color); color: white; text-decoration: none; width: 100%; max-width: 400px;
  height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold;
}

.modal { display: none; position: fixed; z-index: 1000; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); }
.modal-content {
  background: var(--card); width: 90%; max-width: 450px; margin: 40px auto; padding: 30px;
  border-radius: 30px; position: relative; max-height: 80vh; overflow-y: auto;
}
.close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-light); font-size: 24px; }

/* リンクボタンのスタイル */
.link-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px; border-radius: 14px; font-weight: bold; text-decoration: none; margin-bottom: 10px; font-size: 14px;
}
.btn-site { background: var(--primary); color: white; }
.btn-discord { background: var(--discord-color); color: white; }
</style>
</head>
<body>

<header>
  <h1>DAORU</h1>
  <div class="sub">Discover Your DAO Opportunity</div>
</header>

<div class="search-container">
  <div class="search-box">
    <i data-lucide="search" size="20"></i>
    <input type="text" id="searchInput" placeholder="気になるキーワードを入力..." oninput="render()">
  </div>
</div>

<div class="container" id="list"></div>

<div class="fixed-footer">
  <a href="https://line.me/ti/p/O4cPoZHcUk" target="_blank" class="line-btn">
    <i data-lucide="message-circle"></i> 掲載依頼・相談（LINE）
  </a>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="detail"></div>
  </div>
</div>

<script>
// 各DAOのデータ
const items = [
  { id: "ninja", name: "忍者 DAO", desc: "日本最大級！圧倒的な熱量のコミュニティ", tags: ["初心者歓迎", "二次創作", "ゲーム大会"], hot: 1250, discord: "https://discord.com/invite/ninjadao", site: "" },
  { id: "cryptocafe", name: "クリプトカフェ BAR", desc: "恵比寿にあるWeb3好きの拠点", tags: ["リアル店舗", "交流", "恵比寿"], hot: 420, discord: "", site: "https://cryptocafe.bar/" },
  { id: "guildqb", name: "GuildQB / GGX", desc: "ゲームで生きていくを形にするDAO", tags: ["Web3ゲーム", "大会主催", "ゲーム制作"], hot: 890, discord: "https://discord.com/invite/guildqb", site: "https://guildqb.com/" },
  { id: "okaeri", name: "オカエリハブ", desc: "旅と多拠点生活を楽しむ新しい形", tags: ["ゲストハウス", "サブスク", "地方創生"], hot: 310, discord: "", site: "https://www.okaerihub.net/" },
  { id: "heal3", name: "HEAL3", desc: "健康を遊ぶ、Web3ヘルスケアDAO", tags: ["ジム", "健康", "歩いて稼ぐ"], hot: 560, discord: "", site: "https://heal3.com/" },
  { id: "jandao", name: "雀DAO", desc: "麻雀でつながるWeb3コミュニティ", tags: ["麻雀", "大会運営", "趣味"], hot: 180, discord: "", site: "https://x.com/jandao_official" },
  { id: "ngg", name: "NGG (Ninja Game Guild)", desc: "ゲーム制作から毎日プレイまで", tags: ["ゲーム制作", "ボイチャ", "仲間探し"], hot: 720, discord: "https://discord.gg/ngg", site: "" }
];

// 注目数を管理する仕組み（ブラウザに保存）
function getHotCount(id, baseHot) {
  const saved = localStorage.getItem('hot_' + id);
  return saved ? parseInt(saved) : baseHot;
}

function incrementHot(id) {
  const current = getHotCount(id, items.find(i => i.id === id).hot);
  localStorage.setItem('hot_' + id, current + 1);
  render();
}

function init() { lucide.createIcons(); render(); }

function render() {
  const list = document.getElementById("list");
  const query = document.getElementById("searchInput").value.toLowerCase();
  list.innerHTML = "";

  const filtered = items.filter(item => 
    item.name.toLowerCase().includes(query) || 
    item.tags.some(tag => tag.toLowerCase().includes(query))
  );

  filtered.forEach((item) => {
    const tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join("");
    const displayHot = getHotCount(item.id, item.hot);

    list.innerHTML += `
      <div class="item-card" onclick="openModal('${item.id}')">
        <div class="card-top">
          <div class="card-tags">${tagsHtml}</div>
          <div class="hot-badge">🔥 ${displayHot}人が注目</div>
        </div>
        <div class="item-info">
          <h3>${item.name}</h3>
          <p>${item.desc}</p>
        </div>
      </div>
    `;
  });
}

function openModal(id) {
  const item = items.find(i => i.id === id);
  incrementHot(id); // 開いたら注目度アップ！

  let linksHtml = "";
  if(item.site) linksHtml += `<a href="${item.site}" target="_blank" class="link-btn btn-site">🌐 公式サイトを開く</a>`;
  if(item.discord) linksHtml += `<a href="${item.discord}" target="_blank" class="link-btn btn-discord">💬 Discordに参加（アプリ推奨）</a>`;

  document.getElementById("detail").innerHTML = `
    <h2 style="color:var(--primary); margin:0 0 10px 0;">${item.name}</h2>
    <p style="font-size:14px; color:var(--text-light); margin-bottom:20px;">${item.desc}</p>
    <div style="margin-bottom:20px;">${linksHtml}</div>
    <p style="font-size:12px; color:var(--text-light); background:#f8fafc; padding:10px; border-radius:10px;">
      ※Discordが読み込めない場合は、スマホのアプリから直接サーバー名を検索するか、リンクをコピーしてブラウザの別タブで開いてみてください。
    </p>
  `;
  document.getElementById("modal").style.display = "block";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }
init();
</script>
</body>
</html>
