<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAORU | DAO Discovery</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --primary: #2ecc71;
  --primary-light: #ebfaf0;
  --line-color: #06C755;
  --bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  --card: #ffffff;
  --text: #1e293b;
  --text-light: #64748b;
}

body {
  margin: 0;
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: 100px;
  min-height: 100vh;
}

header {
  padding: 40px 20px;
  text-align: center;
}

h1 { 
  margin: 0; 
  font-size: 32px; 
  color: var(--primary); 
  letter-spacing: 2px;
  font-weight: 900;
}
.sub { font-size: 13px; color: var(--text-light); margin-top: 5px; }

/* 検索エリア */
.search-container {
  padding: 0 20px 20px;
  max-width: 500px;
  margin: 0 auto;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box i {
  position: absolute;
  left: 15px;
  color: var(--text-light);
}

.search-box input {
  width: 100%;
  padding: 15px 15px 15px 45px;
  border-radius: 30px;
  border: 1px solid #e2e8f0;
  background: var(--card);
  font-size: 16px;
  outline: none;
  transition: all 0.3s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}

.search-box input:focus {
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(46, 204, 113, 0.15);
}

/* リストエリア */
.section-header {
  padding: 10px 20px;
  max-width: 600px;
  margin: 0 auto;
}

.results-count { font-size: 13px; color: var(--text-light); font-weight: bold; }

.container { 
  padding: 0 15px; 
  max-width: 600px;
  margin: 0 auto;
}

.item-card {
  background: var(--card);
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 16px;
  border: 1px solid rgba(226, 232, 240, 0.8);
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  cursor: pointer;
  transition: all 0.2s ease;
}

.item-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
.item-card:active { transform: scale(0.98); }

.card-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.tag {
  font-size: 11px;
  font-weight: bold;
  color: var(--primary);
  background: var(--primary-light);
  padding: 4px 12px;
  border-radius: 20px;
}

.item-info h3 { margin: 0; font-size: 20px; font-weight: 800; }
.item-info p { margin: 8px 0 0; font-size: 14px; color: var(--text-light); }

/* LINE 固定バー */
.fixed-footer {
  position: fixed;
  bottom: 0; left: 0; width: 100%;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(15px);
  border-top: 1px solid rgba(226, 232, 240, 0.5);
  padding: 15px 20px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  z-index: 900;
}

.line-btn {
  background: var(--line-color);
  color: white;
  text-decoration: none;
  width: 100%;
  max-width: 400px;
  height: 54px;
  border-radius: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: bold;
  box-shadow: 0 10px 20px rgba(6, 199, 85, 0.2);
}

/* モーダル */
.modal {
  display: none; position: fixed; z-index: 1000;
  top:0; left:0; width:100%; height:100%;
  background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
}
.modal-content {
  background: var(--card); width: 90%; max-width: 450px;
  margin: 60px auto; padding: 30px; border-radius: 30px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  position: relative;
}
.close-btn { 
  position: absolute; top: 20px; right: 20px;
  cursor: pointer; color: var(--text-light); font-size: 24px; 
}
.modal-url {
  word-break: break-all;
  color: var(--primary);
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>
<body>

<header>
  <h1>DAORU</h1>
  <div class="sub">Discover Your DAO Opportunity</div>
</header>

<div class="search-container">
  <div class="search-box">
    <i data-lucide="search" size="20"></i>
    <input type="text" id="searchInput" placeholder="気になるキーワードを入力..." oninput="render()">
  </div>
</div>

<div class="section-header">
  <div class="results-count" id="countText">プロジェクトを表示中</div>
</div>

<div class="container" id="list"></div>

<div class="fixed-footer">
  <a href="https://line.me/ti/p/O4cPoZHcUk" target="_blank" class="line-btn">
    <i data-lucide="message-circle"></i>
    掲載したい人はこちら（LINE）
  </a>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="detail"></div>
  </div>
</div>

<script>
const items = [
  { 
    name: "忍者 DAO", 
    desc: "日本最大級！圧倒的な熱量のコミュニティ", 
    tags: ["初心者歓迎", "二次創作", "ゲーム大会", "毎日がお祭り"],
    long: "NFTプロジェクト『CryptoNinja』の公式コミュニティ。誰でも参加でき、イラスト、音楽、メタバース、ゲームなど、数えきれないほどのプロジェクトが同時進行中！Web3の楽しさを知るならまずはここ！\n\nDiscord: https://discord.com/invite/ninjadao"
  },
  { 
    name: "クリプトカフェ BAR", 
    desc: "恵比寿にあるWeb3好きの秘密基地", 
    tags: ["リアル店舗", "交流", "恵比寿", "ドリンク片手に"],
    long: "東京・恵比寿に実在する、Web3やクリプト好きが集まるカフェ＆バー。NFTを会員証のように使ったり、オフラインでのリアルな繋がりが生まれる場所です。初心者さんも大歓迎！\n\nURL: https://cryptocafe.bar/"
  },
  { 
    name: "ギルドキュービー (GuildQB)", 
    desc: "ゲームで生きていくを形にするDAO", 
    tags: ["Web3ゲーム", "大会主催", "賞金あり", "攻略"],
    long: "最新のブロックチェーンゲームの攻略や、大会主催を行うゲームDAO。プロからアマチュアまで、ゲームを全力で楽しみ、新しい経済圏を作る仲間が集まっています。\n\nDiscord: https://discord.com/invite/guildqb\n公式サイト: https://guildqb.com/"
  },
  { 
    name: "オカエリハブ", 
    desc: "旅と多拠点生活を楽しむ新しい形", 
    tags: ["ゲストハウス", "サブスク", "多拠点居住", "地方創生"],
    long: "全国の宿のオーナーたちが協力して運営するDAO。月額定額で各地の拠点に滞在でき、行く先々で『ただいま』と言える温かい関係性が作れるプロジェクトです。\n\nURL: https://www.okaerihub.net/"
  }
];

function init() {
  lucide.createIcons();
  render();
}

function render() {
  const list = document.getElementById("list");
  const query = document.getElementById("searchInput").value.toLowerCase();
  list.innerHTML = "";

  const filtered = items.filter(item => 
    item.name.toLowerCase().includes(query) || 
    item.desc.toLowerCase().includes(query) ||
    item.tags.some(tag => tag.toLowerCase().includes(query))
  );

  document.getElementById("countText").innerText = `${filtered.length} 件のプロジェクト`;

  if(filtered.length === 0) {
    list.innerHTML = "<p style='text-align:center; opacity:0.5; padding:40px 0;'>見つかりませんでした。別の言葉で試してみてください。</p>";
    return;
  }

  filtered.forEach((item) => {
    const tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join("");
    list.innerHTML += `
      <div class="item-card" onclick="openModal('${item.name}')">
        <div class="card-tags">${tagsHtml}</div>
        <div class="item-info">
          <h3>${item.name}</h3>
          <p>${item.desc}</p>
        </div>
      </div>
    `;
  });
}

function openModal(name) {
  const item = items.find(i => i.name === name);
  const tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join("");
  
  // URL部分をリンクとして表示するための簡単な処理
  const formattedLong = item.long.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="modal-url">$1</a>');

  document.getElementById("detail").innerHTML = `
    <div style="margin-bottom:15px;">${tagsHtml}</div>
    <h2 style="color:var(--primary); margin:0 0 10px 0; font-size:24px;">${item.name}</h2>
    <p style="font-size:15px; font-weight:bold; color:var(--text-light); margin-bottom:20px;">${item.desc}</p>
    <div style="background:#f8fafc; padding:20px; border-radius:20px; font-size:14px; white-space:pre-wrap; margin-bottom:20px; border:1px solid #eee; line-height:1.8;">${formattedLong}</div>
    <button style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:15px; font-weight:bold; font-size:16px; cursor:pointer;" onclick="closeModal()">閉じる</button>
  `;
  document.getElementById("modal").style.display = "block";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

init();
</script>
</body>
</html>
